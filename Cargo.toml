[package]
name = "ip2bin"
version = "0.4.0"
edition = "2021"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
ip_network = "0.4"
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
rmcp = { version = "3.4.0", features = ["macros", "server", "transport-io"] }
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "io-std"] }
schemars = "1.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
